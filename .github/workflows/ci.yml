name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# When a pull request gets a newer run, its older still-running run is
# cancelled (one group per PR number; other PRs are separate groups). A
# cancelled run is not a pass: always read the checks of the exact current head.
# Pushes to main use the commit sha as the group and are never cancelled, so
# each main commit keeps its full verification. GitHub does not guarantee which
# run is kept when runs arrive close together or are re-run, so check the
# result for the head you care about after any re-run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan_ruby:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  system-test:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Record browser versions
        # Evidence only (intermittent lost-input failures): which Chrome the
        # runner image provides. A failure here never fails the job.
        run: |
          google-chrome --version || chromium --version || echo "no system chrome on PATH"
          chromedriver --version || echo "chromedriver not on PATH (Selenium Manager resolves it at run time)"
          echo "$ImageOS $ImageVersion"
        continue-on-error: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
          # Operating choice, not a fix: run the system tests in one process.
          # At 50+ tests Rails switches to one worker per CPU (4 Chrome + 4 servers
          # on the runner). The earlier 43-test runs were single process.
          PARALLEL_WORKERS: "1"
          # Diagnostics only, not a fix. Nothing here adds a wait, retry or assertion.
          # Everything below lands in one directory that the next steps upload only
          # when the job failed: ChromeDriver's verbose log, Chrome's own log, one
          # JSON record per failed test (summary, browser targets and window bounds,
          # the full page-side input capture, the recent inputs). A failed test also
          # prints a FAILURE_SUMMARY block, and every test prints an INPUT_OK line
          # (the capture's event counts) as a positive control. The test data is
          # synthetic; the raw logs carry its URLs, element ids and field values.
          DIAG_ARTIFACT_DIR: ${{ github.workspace }}/tmp/diagnostics
          CHROMEDRIVER_TIMELINE_DIR: ${{ github.workspace }}/tmp/diagnostics/chromedriver
          CHROMEDRIVER_LOG_KEEP: "1"
          DIAG_CHROME_LOG: "1"
          DIAG_PASS_CONTROL: "1"
          DIAG_INPUT_STATE: "1"
          # Reads targets and window bounds over CDP right AFTER each element click
          # and send_keys returned (a few ms; the input itself is not delayed).
          # Remove this line to turn the per-input read off.
          # Diagnostic, not a fix: -v prints each test name, time and result in run
          # order so a red can be read against the tests before it.
        run: |
          trap 'exit 143' TERM
          trap 'exit 130' INT
          bin/rails db:test:prepare && bin/rails test:system -v

      - name: Keep diagnostics and screenshots from a failed system test run
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: system-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/tmp/diagnostics
            ${{ github.workspace }}/tmp/screenshots
          # 90 days is the longest GitHub keeps an artifact.
          retention-days: 30
          if-no-files-found: ignore
